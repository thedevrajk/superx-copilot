<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SuperX Copilot</title>
    <link rel="stylesheet" href="https://fonts.bunny.net/css?family=geist:400,500,600" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0b0b;
        --fg: #f4f4f1;
        --muted: #8d8d88;
        --faint: #5c5c58;
        --line: #2a2a2a;
        --lime: #d6ef6a;
        --ink: #14160c;
        --bad: #e25b4a;
        --warn: #e2b15a;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 400 13px/1.4 "Geist", ui-sans-serif, system-ui, sans-serif;
      }
      .shell {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        padding: 14px 14px 12px;
      }
      header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .who { display: flex; align-items: center; gap: 8px; min-width: 0; }
      .mark {
        width: 22px; height: 22px; border-radius: 5px; background: #161616;
        border: 1px solid var(--line); display: grid; place-items: center; flex: none;
      }
      h1 { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; }
      .meta { margin: 1px 0 0; color: var(--faint); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
      .chip { color: var(--muted); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; flex: none; }
      .meters { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; }
      .k { display: flex; justify-content: space-between; gap: 8px; color: var(--faint); font-size: 10px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; }
      .k b { color: var(--fg); font-weight: 500; letter-spacing: 0; font-variant-numeric: tabular-nums; }
      .track { margin-top: 6px; height: 2px; background: #1c1c1c; }
      .track > span { display: block; height: 100%; width: 0; background: var(--lime); }
      .track.warn > span { background: var(--warn); }
      .track.bad > span { background: var(--bad); }
      label.k { margin-top: 16px; }
      textarea, input {
        width: 100%; border: 0; border-bottom: 1px solid var(--line); background: transparent;
        color: var(--fg); border-radius: 0; font: inherit; padding: 8px 0; resize: none;
      }
      textarea:focus, input:focus { outline: none; border-bottom-color: var(--fg); }
      #custom { min-height: 36px; }
      .post {
        margin: 14px 0 0; color: var(--muted); font-size: 12px; line-height: 1.45;
        display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
      }
      #cards { margin-top: 8px; display: flex; flex-direction: column; }
      .card {
        text-align: left; width: 100%; border: 0; border-top: 1px solid var(--line);
        background: transparent; color: inherit; padding: 10px 0 10px 10px; cursor: pointer; border-radius: 0;
      }
      .card.active { box-shadow: inset 2px 0 0 var(--lime); }
      .card .label { color: var(--faint); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; }
      .card.active .label { color: var(--lime); }
      .card .body { margin-top: 4px; font-size: 13.5px; line-height: 1.45; }
      .notice { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
      .notice strong { display: block; font-size: 11px; letter-spacing: 0.16em; font-weight: 600; }
      .notice p { margin: 6px 0 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
      #scratch { min-height: 52px; margin-top: 8px; }
      .count { margin-top: 4px; text-align: right; color: var(--faint); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; font-variant-numeric: tabular-nums; }
      .count.warn { color: var(--warn); }
      .count.bad { color: var(--bad); }
      .actions { display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px; margin-top: 12px; }
      button {
        min-height: 36px; border-radius: 4px; border: 0; padding: 0 12px;
        font: 600 11px/1 "Geist", ui-sans-serif, system-ui, sans-serif;
        letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer;
      }
      button:active:not(:disabled) { transform: scale(0.98); }
      button:disabled { opacity: 0.35; cursor: default; }
      #reroll, .ghost { background: #1a1a1a; color: var(--fg); }
      #insert, .lime { background: var(--lime); color: var(--ink); }
      footer { margin-top: auto; padding-top: 14px; display: flex; justify-content: space-between; align-items: center; }
      footer button { background: transparent; color: var(--muted); padding: 0; min-height: 32px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <div class="who">
          <span class="mark" aria-hidden="true">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
              <path d="M6 1.2 10.2 6 6 10.8 1.8 6 6 1.2Z" stroke="#d6ef6a" stroke-width="1.2"/>
            </svg>
          </span>
          <div>
            <h1>SuperX</h1>
            <p class="meta" id="source">No post yet</p>
          </div>
        </div>
        <div class="chip" id="chip">1.4</div>
      </header>
      <div class="meters">
        <div>
          <div class="k"><span>Requests</span><b id="req-label">0</b></div>
          <div class="track" id="req-bar"><span></span></div>
        </div>
        <div>
          <div class="k"><span>Tokens</span><b id="tok-label">0</b></div>
          <div class="track" id="tok-bar"><span></span></div>
        </div>
      </div>
      <label class="k" for="custom">Steer</label>
      <textarea id="custom" rows="1" placeholder="Shorter. Name the number. No hedge."></textarea>
      <p class="post" id="post" hidden></p>
      <div id="cards"></div>
      <div class="notice" id="empty">
        <strong>No post</strong>
        <p>Hit the pencil on a post. The line is written here. Nothing is filled in for you.</p>
      </div>
      <div class="notice" id="error" hidden>
        <strong id="error-title">No reply</strong>
        <p id="error-text"></p>
        <div class="actions">
          <button class="lime" id="open-settings" type="button">Settings</button>
        </div>
      </div>
      <textarea id="scratch" rows="2" placeholder="Edit before it goes in." hidden></textarea>
      <div class="count" id="count" hidden></div>
      <div class="actions" id="actions" hidden>
        <button id="reroll" type="button">Reroll</button>
        <button id="insert" type="button">Insert</button>
      </div>
      <footer>
        <button id="settings-link" type="button">Settings</button>
        <span class="chip" id="limit">1,000 · 200k</span>
      </footer>
    </div>
    <script src="reply-brain.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
